name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # never hang for hours: a normal run takes a few minutes
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@la-jarre-a-son'

      # Install scripts are skipped: they would compile the MIDI module (@julusian/midi),
      # which ships ready-made binaries for every system. electron-builder's
      # "install-app-deps" (in postinstall) is what hung on Windows.
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          cd release/app
          npm ci --ignore-scripts
          npm run link-modules
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Package (no installer)
        shell: bash
        run: npx electron-builder --dir --publish never -c.npmRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check Lint
        run: npm run lint

      - name: Check Types
        run: npm exec tsc

      - name: Check Unit Tests
        run: npm test
