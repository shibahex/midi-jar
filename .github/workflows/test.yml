name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js and NPM
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@la-jarre-a-son'

      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # @electron/rebuild pulls in node-gyp 9, which can't detect Visual Studio 2026.
      # Replace the copy in ./node_modules before any native module gets compiled.
      - name: Use node-gyp with Visual Studio 2026 support
        run: npm install --no-save --ignore-scripts node-gyp@12
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run postinstall
        run: npm run postinstall
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run package

      - name: Check Lint
        run: npm run lint

      - name: Check Types
        run: npm exec tsc

      - name: Check Unit Tests
        run: npm test
