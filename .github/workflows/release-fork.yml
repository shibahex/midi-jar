# Builds Windows, macOS and Linux apps on a fork and uploads them to a draft release
# of that fork (upstream uses publish-*.yml). Run it from the Actions tab.
name: Release (fork)

on:
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload the apps
  packages: read # @la-jarre-a-son packages on GitHub Packages

jobs:
  release:
    if: ${{ github.repository_owner != 'la-jarre-a-son' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      # node-gyp 9 needs distutils, removed in Python 3.12
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@la-jarre-a-son'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the apps are not signed: no certificates on a fork
      - name: Build and upload to the draft release
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} --publish always \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }}
