# Builds Windows, macOS and Linux apps on a fork and uploads them to a draft release
# of that fork (upstream uses publish-*.yml). Run it from the Actions tab.
name: Release (fork)

on:
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload the apps
  packages: read # @la-jarre-a-son packages on GitHub Packages

jobs:
  release:
    if: ${{ github.repository_owner != 'la-jarre-a-son' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@la-jarre-a-son'

      # Install scripts are skipped: they would compile the MIDI module (@julusian/midi),
      # which ships ready-made binaries for every system and loads them in Electron.
      # (electron-builder sets npm_config_build_from_source=false, which the module's
      # pkg-prebuilds check reads as "build from source")
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          cd release/app
          npm ci --ignore-scripts
          npm run link-modules
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the apps are not signed: no certificates on a fork
      - name: Build and upload to the draft release
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} --publish always -c.npmRebuild=false \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }}
